# The dbt project (CLAUDE.md → Repo map). One project, two targets
# (dbt/profiles.yml: duckdb, bigquery). Every var has a default here and is
# named in the spec that introduced it — Phase 3 introduces the three below.
name: ontime
version: "0.1.0"
profile: ontime
# unit_tests: needs ≥ 1.8; `accepted_values … arguments:` needs ≥ 1.10.
require-dbt-version: [">=1.10.0", "<2.0.0"]

# No services, no network (CLAUDE.md): dbt's anonymous usage tracking is off.
flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Phase 3 (specs/phase-3-attribution.md). skew_max_min equals
# generator/models.py::SKEW_MAX_MIN (equality-tested); only a NEGATIVE upload
# delay past it is skew (ARCHITECTURE §8). Phase 5 adds the send-time model's
# hyper-parameters (specs/phase-5-send-time.md).
vars:
  skew_max_min: 5
  delivery_grace_min: 10
  unattributed_max: 0.10
  retention_days: 28
  feature_window_days: 30
  max_user_shift_min: 120
  shrinkage_pseudo_count: 5
  model_version: v1

models:
  ontime:
    staging:
      +materialized: table
      +schema: staging
    attribution:
      +materialized: table
      +schema: attribution
    marts:
      +materialized: table
      +schema: marts
    features:
      +materialized: table
      +schema: features
    scores:
      +materialized: table
      +schema: scores
