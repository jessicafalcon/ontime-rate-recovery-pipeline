# The dbt project (CLAUDE.md → Repo map). One project, two targets
# (dbt/profiles.yml: duckdb, bigquery). Every var has a default here and is
# named in the spec that introduced it — Phase 2 introduces none.
name: ontime
version: "0.1.0"
profile: ontime

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ontime:
    staging:
      +materialized: table
      +schema: staging
