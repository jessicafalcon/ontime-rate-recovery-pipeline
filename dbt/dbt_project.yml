# The dbt project (CLAUDE.md → Repo map). One project, two targets
# (dbt/profiles.yml: duckdb, bigquery). Every var has a default here and is
# named in the spec that introduced it — Phase 3 introduces the three below.
name: ontime
version: "0.1.0"
profile: ontime
# unit_tests: needs ≥ 1.8; `accepted_values … arguments:` needs ≥ 1.10.
require-dbt-version: [">=1.10.0", "<2.0.0"]

# No services, no network (CLAUDE.md): dbt's anonymous usage tracking is off.
flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Phase 3 (specs/phase-3-attribution.md). skew_max_min equals
# generator/models.py::SKEW_MAX_MIN (equality-tested); only a NEGATIVE upload
# delay past it is skew (ARCHITECTURE §8). Phase 5 adds the send-time model's
# hyper-parameters (specs/phase-5-send-time.md). Phase 7 adds lookback_days
# (specs/phase-7-incremental.md): the reprocessing lookback for the event-level
# incremental models, data-derived horizon = max(server_upload_time); a partition
# is `final` once it is >= lookback_days behind it. Pinned identity, lookback_days
# * 24 > late_arrival_max_hours on every profile (medium's 72 h is the floor), so
# a late event never lands on a closed partition. Phase 10 adds
# dim_user_identifier — which relation the raw.dim_user SOURCE resolves to
# (§3.3's source-config swap): default the landed table on every target; the
# Spanner integration run overrides it to the federation view dim_user_spanner.
vars:
  skew_max_min: 5
  delivery_grace_min: 10
  unattributed_max: 0.10
  retention_days: 28
  feature_window_days: 30
  max_user_shift_min: 120
  shrinkage_pseudo_count: 5
  model_version: v1
  lookback_days: 5
  # fix/append-landing: the extra days the BigQuery source-scan prune reaches
  # BELOW the lookback window, so the window is a SUPERSET — wide enough for the
  # client<->server clock offset AND to co-locate a duplicate's copies. A declared
  # floor, pinned by tests/test_incremental.py::test_source_prune_margin_covers_
  # every_profile to be >= ceil(late_arrival_max_hours/24) + tz_days + dup_days for
  # every profile (5 covers medium/large's 72 h).
  source_prune_margin_days: 5
  dim_user_identifier: dim_user

models:
  ontime:
    # The folder default is `table`; the three EVENT-LEVEL models override it to
    # `incremental` in their own config() (Phase 7 — stg_events, stg_prompts,
    # attribution), where the incremental_strategy and partition_by live. The
    # default still applies to any future non-incremental model in these folders.
    staging:
      +materialized: table
      +schema: staging
    attribution:
      +materialized: table
      +schema: attribution
    marts:
      +materialized: table
      +schema: marts
    features:
      +materialized: table
      +schema: features
    scores:
      +materialized: table
      +schema: scores
