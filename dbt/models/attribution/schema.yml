version: 2

models:
  - name: attribution
    description: >
      One row per prompt_id (= prompt×user) with exactly one of the five
      labels in ARCHITECTURE §2.5 precedence (delivery_fault, then the skew
      gate, then on_time, upload_fault, timing_gap, else unattributed), plus
      the per-prompt evidence columns each arm reads. cohort_id is the
      prompt's own (prompt_sent event). Full rebuild; provisional/final status
      is Phase 7.
    columns:
      - name: prompt_id
        data_tests: [unique, not_null]
      - name: user_id
        data_tests: [not_null]
      - name: cohort_id
        description: The cohort the prompt was sent as (stg_prompts.prompt_cohort_id) — Phase 4's denominator key.
        data_tests: [not_null]
      - name: label
        description: Exactly one of the five; a sixth value is a BLOCKER (CLAUDE.md label contract).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [on_time, upload_fault, delivery_fault, timing_gap, unattributed]
      - name: delivered_in_grace
        description: delivered_at within delivery_grace_min of sent_at.
        data_tests: [not_null]
      - name: min_upload_delay_seconds
        description: min(server_received_time − client_event_time) over the prompt's events; below −skew_max_min·60 = a client clock ahead (skew).
        data_tests: [not_null]
      - name: response_on_time
        description: A response_recorded with both clocks inside the window.
      - name: captured_in_window_received_late
        description: A capture_started / upload_* event with client time inside the window and received time outside it — the three-clock signal (response_recorded is backend-stamped, so the device's clock lives on these).

unit_tests:
  - name: attribution_delivery_fault_no_receipt
    description: >
      Rule 1: a prompt with no prompt_delivered receipt is a delivery_fault.
    model: attribution
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_prompts')
        format: sql
        rows: |
          select 'p-1' as prompt_id, 'u-1' as user_id, 'c-morning' as prompt_cohort_id, 'c-morning' as cohort_id, 'UTC' as tz, 60 as window_minutes, timestamp '2026-01-05 08:00:00' as sent_at, timestamp '2026-01-05 08:00:00' as sent_at_local, cast(null as timestamp) as delivered_at
      - input: ref('stg_events')
        format: sql
        rows: |
          select 'p-1-s' as insert_id, 'prompt_sent' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:00:00' as client_event_time, timestamp '2026-01-05 08:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:00:00', timestamp '2026-01-05 08:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
    expect:
      rows:
        - {prompt_id: p-1, label: delivery_fault, delivered_in_grace: false}
  - name: attribution_delivery_fault_receipt_after_grace
    description: >
      Rule 1, the grace edge: a receipt 11 min after send (> delivery_grace_min = 10) is a delivery_fault even though delivered_at is populated; a receipt at exactly 10 min is in grace (and, with no other evidence, a timing_gap).
    model: attribution
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_prompts')
        format: sql
        rows: |
          select 'p-1' as prompt_id, 'u-1' as user_id, 'c-morning' as prompt_cohort_id, 'c-morning' as cohort_id, 'UTC' as tz, 60 as window_minutes, timestamp '2026-01-05 08:00:00' as sent_at, timestamp '2026-01-05 08:00:00' as sent_at_local, timestamp '2026-01-05 08:11:00' as delivered_at
          union all select 'p-2' as prompt_id, 'u-1' as user_id, 'c-morning' as prompt_cohort_id, 'c-morning' as cohort_id, 'UTC' as tz, 60 as window_minutes, timestamp '2026-01-05 08:00:00' as sent_at, timestamp '2026-01-05 08:00:00' as sent_at_local, timestamp '2026-01-05 08:10:00' as delivered_at
      - input: ref('stg_events')
        format: sql
        rows: |
          select 'p-1-s' as insert_id, 'prompt_sent' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:00:00' as client_event_time, timestamp '2026-01-05 08:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:00:00', timestamp '2026-01-05 08:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-2-s' as insert_id, 'prompt_sent' as event_type, 'p-2' as prompt_id, timestamp '2026-01-05 08:00:00' as client_event_time, timestamp '2026-01-05 08:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:00:00', timestamp '2026-01-05 08:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
    expect:
      rows:
        - {prompt_id: p-1, label: delivery_fault, delivered_in_grace: false}
        - {prompt_id: p-2, label: timing_gap, delivered_in_grace: true}
  - name: attribution_skew_negative_delay
    description: >
      Rule 2 and invariant 3: skew is a client clock AHEAD of the server past skew_max_min (5 min). p-1 has one capture with delay −301 s → unattributed although its response is on time; p-2 at exactly −300 s is not skew; p-3's +100000 s delay is an upload delay, never skew.
    model: attribution
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_prompts')
        format: sql
        rows: |
          select 'p-1' as prompt_id, 'u-1' as user_id, 'c-morning' as prompt_cohort_id, 'c-morning' as cohort_id, 'UTC' as tz, 60 as window_minutes, timestamp '2026-01-05 08:00:00' as sent_at, timestamp '2026-01-05 08:00:00' as sent_at_local, timestamp '2026-01-05 08:01:00' as delivered_at
          union all select 'p-2' as prompt_id, 'u-1' as user_id, 'c-morning' as prompt_cohort_id, 'c-morning' as cohort_id, 'UTC' as tz, 60 as window_minutes, timestamp '2026-01-05 08:00:00' as sent_at, timestamp '2026-01-05 08:00:00' as sent_at_local, timestamp '2026-01-05 08:01:00' as delivered_at
          union all select 'p-3' as prompt_id, 'u-1' as user_id, 'c-morning' as prompt_cohort_id, 'c-morning' as cohort_id, 'UTC' as tz, 60 as window_minutes, timestamp '2026-01-05 08:00:00' as sent_at, timestamp '2026-01-05 08:00:00' as sent_at_local, timestamp '2026-01-05 08:01:00' as delivered_at
      - input: ref('stg_events')
        format: sql
        rows: |
          select 'p-1-s' as insert_id, 'prompt_sent' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:00:00' as client_event_time, timestamp '2026-01-05 08:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:00:00', timestamp '2026-01-05 08:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-1-c' as insert_id, 'capture_started' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:15:01' as client_event_time, timestamp '2026-01-05 08:10:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:15:01', timestamp '2026-01-05 08:10:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-1-r' as insert_id, 'response_recorded' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:20:00' as client_event_time, timestamp '2026-01-05 08:20:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:20:00', timestamp '2026-01-05 08:20:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-2-s' as insert_id, 'prompt_sent' as event_type, 'p-2' as prompt_id, timestamp '2026-01-05 08:00:00' as client_event_time, timestamp '2026-01-05 08:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:00:00', timestamp '2026-01-05 08:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-2-c' as insert_id, 'capture_started' as event_type, 'p-2' as prompt_id, timestamp '2026-01-05 08:15:00' as client_event_time, timestamp '2026-01-05 08:10:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:15:00', timestamp '2026-01-05 08:10:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-2-r' as insert_id, 'response_recorded' as event_type, 'p-2' as prompt_id, timestamp '2026-01-05 08:20:00' as client_event_time, timestamp '2026-01-05 08:20:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:20:00', timestamp '2026-01-05 08:20:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-3-s' as insert_id, 'prompt_sent' as event_type, 'p-3' as prompt_id, timestamp '2026-01-05 08:00:00' as client_event_time, timestamp '2026-01-05 08:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:00:00', timestamp '2026-01-05 08:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-3-c' as insert_id, 'capture_started' as event_type, 'p-3' as prompt_id, timestamp '2026-01-05 08:10:00' as client_event_time, timestamp '2026-01-06 11:56:40' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:10:00', timestamp '2026-01-06 11:56:40') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-3-r' as insert_id, 'response_recorded' as event_type, 'p-3' as prompt_id, timestamp '2026-01-05 08:20:00' as client_event_time, timestamp '2026-01-05 08:20:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:20:00', timestamp '2026-01-05 08:20:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
    expect:
      rows:
        - {prompt_id: p-1, label: unattributed, min_upload_delay_seconds: -301}
        - {prompt_id: p-2, label: on_time, min_upload_delay_seconds: -300}
        - {prompt_id: p-3, label: on_time, min_upload_delay_seconds: 0}
  - name: attribution_on_time
    description: >
      Rule 3: a response whose client and received clocks are both inside [sent_at, sent_at + window_minutes).
    model: attribution
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_prompts')
        format: sql
        rows: |
          select 'p-1' as prompt_id, 'u-1' as user_id, 'c-morning' as prompt_cohort_id, 'c-morning' as cohort_id, 'UTC' as tz, 60 as window_minutes, timestamp '2026-01-05 08:00:00' as sent_at, timestamp '2026-01-05 08:00:00' as sent_at_local, timestamp '2026-01-05 08:01:00' as delivered_at
      - input: ref('stg_events')
        format: sql
        rows: |
          select 'p-1-s' as insert_id, 'prompt_sent' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:00:00' as client_event_time, timestamp '2026-01-05 08:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:00:00', timestamp '2026-01-05 08:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-1-c' as insert_id, 'capture_started' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:10:00' as client_event_time, timestamp '2026-01-05 08:10:05' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:10:00', timestamp '2026-01-05 08:10:05') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-1-r' as insert_id, 'response_recorded' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:20:00' as client_event_time, timestamp '2026-01-05 08:20:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:20:00', timestamp '2026-01-05 08:20:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
    expect:
      rows:
        - {prompt_id: p-1, label: on_time, response_on_time: true}
  - name: attribution_upload_fault_received_after_window
    description: >
      Rule 4a: the three-clock signal — a capture with client time inside the window (08:20) received after it (10:00), then a backend-stamped response, is an upload_fault; the window end is exclusive (received at exactly 09:00:00 is outside).
    model: attribution
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_prompts')
        format: sql
        rows: |
          select 'p-1' as prompt_id, 'u-1' as user_id, 'c-morning' as prompt_cohort_id, 'c-morning' as cohort_id, 'UTC' as tz, 60 as window_minutes, timestamp '2026-01-05 08:00:00' as sent_at, timestamp '2026-01-05 08:00:00' as sent_at_local, timestamp '2026-01-05 08:01:00' as delivered_at
          union all select 'p-2' as prompt_id, 'u-1' as user_id, 'c-morning' as prompt_cohort_id, 'c-morning' as cohort_id, 'UTC' as tz, 60 as window_minutes, timestamp '2026-01-05 08:00:00' as sent_at, timestamp '2026-01-05 08:00:00' as sent_at_local, timestamp '2026-01-05 08:01:00' as delivered_at
      - input: ref('stg_events')
        format: sql
        rows: |
          select 'p-1-s' as insert_id, 'prompt_sent' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:00:00' as client_event_time, timestamp '2026-01-05 08:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:00:00', timestamp '2026-01-05 08:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-1-c' as insert_id, 'capture_started' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:20:00' as client_event_time, timestamp '2026-01-05 10:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:20:00', timestamp '2026-01-05 10:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-1-r' as insert_id, 'response_recorded' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 10:00:30' as client_event_time, timestamp '2026-01-05 10:00:30' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 10:00:30', timestamp '2026-01-05 10:00:30') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-2-s' as insert_id, 'prompt_sent' as event_type, 'p-2' as prompt_id, timestamp '2026-01-05 08:00:00' as client_event_time, timestamp '2026-01-05 08:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:00:00', timestamp '2026-01-05 08:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-2-c' as insert_id, 'capture_started' as event_type, 'p-2' as prompt_id, timestamp '2026-01-05 08:20:00' as client_event_time, timestamp '2026-01-05 09:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:20:00', timestamp '2026-01-05 09:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-2-r' as insert_id, 'response_recorded' as event_type, 'p-2' as prompt_id, timestamp '2026-01-05 09:00:30' as client_event_time, timestamp '2026-01-05 09:00:30' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 09:00:30', timestamp '2026-01-05 09:00:30') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
    expect:
      rows:
        - {prompt_id: p-1, label: upload_fault, captured_in_window_received_late: true}
        - {prompt_id: p-2, label: upload_fault, captured_in_window_received_late: true}
  - name: attribution_upload_fault_failed_chain
    description: >
      Rule 4b: an upload_failed chain with no response_recorded is an upload_fault.
    model: attribution
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_prompts')
        format: sql
        rows: |
          select 'p-1' as prompt_id, 'u-1' as user_id, 'c-morning' as prompt_cohort_id, 'c-morning' as cohort_id, 'UTC' as tz, 60 as window_minutes, timestamp '2026-01-05 08:00:00' as sent_at, timestamp '2026-01-05 08:00:00' as sent_at_local, timestamp '2026-01-05 08:01:00' as delivered_at
      - input: ref('stg_events')
        format: sql
        rows: |
          select 'p-1-s' as insert_id, 'prompt_sent' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:00:00' as client_event_time, timestamp '2026-01-05 08:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:00:00', timestamp '2026-01-05 08:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-1-c' as insert_id, 'capture_started' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:10:00' as client_event_time, timestamp '2026-01-05 08:10:05' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:10:00', timestamp '2026-01-05 08:10:05') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-1-u1' as insert_id, 'upload_started' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:12:00' as client_event_time, timestamp '2026-01-05 08:12:05' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:12:00', timestamp '2026-01-05 08:12:05') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-1-f1' as insert_id, 'upload_failed' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:13:00' as client_event_time, timestamp '2026-01-05 08:13:05' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:13:00', timestamp '2026-01-05 08:13:05') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
    expect:
      rows:
        - {prompt_id: p-1, label: upload_fault, has_upload_failed: true, has_response: false}
  - name: attribution_timing_gap
    description: >
      Rule 5: delivered in grace, no capture_started or response_recorded inside the window, no upload event — a prompt_opened alone is not action (delivery + no-action evidence alone, DECISIONS Phase 1).
    model: attribution
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_prompts')
        format: sql
        rows: |
          select 'p-1' as prompt_id, 'u-1' as user_id, 'c-morning' as prompt_cohort_id, 'c-morning' as cohort_id, 'UTC' as tz, 60 as window_minutes, timestamp '2026-01-05 08:00:00' as sent_at, timestamp '2026-01-05 08:00:00' as sent_at_local, timestamp '2026-01-05 08:01:00' as delivered_at
          union all select 'p-2' as prompt_id, 'u-1' as user_id, 'c-morning' as prompt_cohort_id, 'c-morning' as cohort_id, 'UTC' as tz, 60 as window_minutes, timestamp '2026-01-05 08:00:00' as sent_at, timestamp '2026-01-05 08:00:00' as sent_at_local, timestamp '2026-01-05 08:01:00' as delivered_at
      - input: ref('stg_events')
        format: sql
        rows: |
          select 'p-1-s' as insert_id, 'prompt_sent' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:00:00' as client_event_time, timestamp '2026-01-05 08:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:00:00', timestamp '2026-01-05 08:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-1-o' as insert_id, 'prompt_opened' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:05:00' as client_event_time, timestamp '2026-01-05 08:05:05' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:05:00', timestamp '2026-01-05 08:05:05') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-2-s' as insert_id, 'prompt_sent' as event_type, 'p-2' as prompt_id, timestamp '2026-01-05 08:00:00' as client_event_time, timestamp '2026-01-05 08:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:00:00', timestamp '2026-01-05 08:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
    expect:
      rows:
        - {prompt_id: p-1, label: timing_gap}
        - {prompt_id: p-2, label: timing_gap}
  - name: attribution_residual_is_unattributed
    description: >
      The else arm: contradictory evidence — a capture_started with no upload event and no response — is unattributed, never guessed.
    model: attribution
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_prompts')
        format: sql
        rows: |
          select 'p-1' as prompt_id, 'u-1' as user_id, 'c-morning' as prompt_cohort_id, 'c-morning' as cohort_id, 'UTC' as tz, 60 as window_minutes, timestamp '2026-01-05 08:00:00' as sent_at, timestamp '2026-01-05 08:00:00' as sent_at_local, timestamp '2026-01-05 08:01:00' as delivered_at
      - input: ref('stg_events')
        format: sql
        rows: |
          select 'p-1-s' as insert_id, 'prompt_sent' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:00:00' as client_event_time, timestamp '2026-01-05 08:00:00' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:00:00', timestamp '2026-01-05 08:00:00') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
          union all select 'p-1-c' as insert_id, 'capture_started' as event_type, 'p-1' as prompt_id, timestamp '2026-01-05 08:10:00' as client_event_time, timestamp '2026-01-05 08:10:05' as server_received_time, cast(date_diff('second', timestamp '2026-01-05 08:10:00', timestamp '2026-01-05 08:10:05') as bigint) as upload_delay_seconds, cast(null as timestamp) as server_upload_time
    expect:
      rows:
        - {prompt_id: p-1, label: unattributed, has_capture_in_window: true, has_upload_event: false}
  - name: attribution_delivery_fault_beats_everything
    description: >
      Overlap 1–2/3: no receipt, yet an on-time response AND a skewed capture — the receipt is server-stamped, so delivery_fault wins.
    model: attribution
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_prompts')
        format: sql
        rows: |
          select 'p-1' as prompt_id, 'u-1' as user_id, 'c-morning' as prompt_cohort_id, 'c-morning' as cohort_id, 'UTC' as tz, 60 as window_minutes, timestamp '2026-01-05 08:00:00' as sent_at, timestamp '2026-01-05 08:00:00' as sent_at_local, cast(null as timestamp) as delivered_at
      - input: ref('stg_events')
