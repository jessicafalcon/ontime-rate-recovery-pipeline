name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: nothing here writes to the repo. Superseded runs on the
# same ref are cancelled (metered minutes).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # `make lint` executes a third-party pre-commit hook; it must not find
          # a usable token in .git/config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.5" # match local; bump deliberately
      # --locked: fail on a stale lock instead of silently re-resolving to
      # versions whose hashes nobody reviewed.
      - run: uv sync --locked
      - run: make lint
      - run: make check-docs
      - run: make test
      # Phase 2 adds: dbt build on DuckDB over fixtures/tiny (the golden gate).
